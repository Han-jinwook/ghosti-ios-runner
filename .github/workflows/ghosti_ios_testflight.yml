name: Ghosti iOS TestFlight Build & Upload

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Marketing Version (e.g. 1.0.16)"
        required: false
        default: "1.0.16"
      build_number:
        description: "Build Number (e.g. 16)"
        required: false
        default: "16"

permissions:
  contents: read

jobs:
  build-and-upload-ios:
    if: github.actor == 'Han-jinwook'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Select Latest Xcode (26+)
        run: |
          ls -d /Applications/Xcode*.app
          LATEST_XCODE=$(ls -d /Applications/Xcode*.app | grep -v -i beta | sort -V | tail -n 1)
          if [ -z "$LATEST_XCODE" ]; then
            LATEST_XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)
          fi
          echo "Selecting Xcode: $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          xcodebuild -version

      - name: Checkout Ghosti Repository
        uses: actions/checkout@v4
        with:
          repository: Han-jinwook/Ghosti
          ref: main
          path: ghosti
          token: ${{ secrets.GH_PAT }}
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Web Dependencies & Build Web Bundle
        working-directory: ghosti
        run: |
          rm -rf public/Merlin_Z_Core.zip public/showroom public/poc public/*_4K.jpg || true
          npm install --legacy-peer-deps
          npm run build
          rm -rf dist/Merlin_Z_Core.zip dist/showroom dist/poc dist/*_4K.jpg || true
          npx cap sync ios
          rm -rf ios/App/App/public/Merlin_Z_Core.zip ios/App/App/public/showroom ios/App/App/public/poc ios/App/App/public/*_4K.jpg || true

      - name: Configure iOS Info.plist & Project Signing
        working-directory: ghosti
        env:
          VERSION_NAME: ${{ inputs.version_name || '1.0.16' }}
          BUILD_NUMBER: ${{ inputs.build_number || '16' }}
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          plutil -replace ITSAppUsesNonExemptEncryption -bool NO ios/App/App/Info.plist
          python3 - << 'EOF'
          import os, re
          pbx_path = "ios/App/App.xcodeproj/project.pbxproj"
          with open(pbx_path, "r", encoding="utf-8") as f:
              txt = f.read()
          ver = os.environ.get("VERSION_NAME", "1.0.16")
          bld = os.environ.get("BUILD_NUMBER", "16")
          team = os.environ.get("TEAM_ID", "7K5PPQDZ5L")
          txt = txt.replace(
              "ProvisioningStyle = Automatic;",
              f"ProvisioningStyle = Manual;\n\t\t\t\t\t\tDevelopmentTeam = {team};"
          )

          def patch_cfg(match):
              blk = match.group(0)
              if "PRODUCT_BUNDLE_IDENTIFIER = app.sundreamer.ghosti.share;" in blk:
                  spec = "Ghosti Share App Store"
              elif "PRODUCT_BUNDLE_IDENTIFIER = app.sundreamer.ghosti;" in blk:
                  spec = "Ghosti App Store"
              else:
                  return blk
              blk = blk.replace(
                  "CODE_SIGN_STYLE = Automatic;",
                  f'CODE_SIGN_STYLE = Manual;\n\t\t\t\tDEVELOPMENT_TEAM = {team};\n\t\t\t\tCODE_SIGN_IDENTITY = "Apple Distribution";\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "{spec}";'
              )
              return blk

          txt = re.sub(r"\b[0-9A-F]{24}\b /\* (?:Debug|Release) \*/ = \{\s*isa = XCBuildConfiguration;.*?\n\t\t\};", patch_cfg, txt, flags=re.S)
          txt = txt.replace("CURRENT_PROJECT_VERSION = 1;", f"CURRENT_PROJECT_VERSION = {bld};")
          txt = txt.replace("MARKETING_VERSION = 1.0;", f"MARKETING_VERSION = {ver};")
          with open(pbx_path, "w", encoding="utf-8") as f:
              f.write(txt)
          print("Updated project.pbxproj for App + GhostKeyShareExtension manual signing:", ver, bld)
          EOF

      - name: Install Apple Distribution Certificate & Provisioning Profiles
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_MOBILEPROVISION_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          KEYCHAIN_PASSWORD: "TempKeychainPassword2026!"
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KB_PP_PATH=$RUNNER_TEMP/build_kb_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH $(security list-keychains -d user | sed s/\"//g)

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< $(/usr/bin/security cms -D -i $PP_PATH))
          cp $PP_PATH "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          echo "Installed App Provisioning Profile UUID: $UUID"

          python3 - << 'PYEOF'
          import base64, json, os, subprocess, tempfile, time, urllib.request

          def b64u(b: bytes) -> str:
              return base64.urlsafe_b64encode(b).rstrip(b"=").decode("ascii")

          def der_to_raw_ecdsa(der: bytes) -> bytes:
              assert der[0] == 0x30
              idx = 2 if der[1] < 0x80 else 2 + (der[1] & 0x7F)
              assert der[idx] == 0x02
              r_len = der[idx + 1]
              r = der[idx + 2 : idx + 2 + r_len].lstrip(b"\x00")
              idx = idx + 2 + r_len
              assert der[idx] == 0x02
              s_len = der[idx + 1]
              s = der[idx + 2 : idx + 2 + s_len].lstrip(b"\x00")
              return r.rjust(32, b"\x00") + s.rjust(32, b"\x00")

          kid = os.environ["APPLE_API_KEY_ID"].strip()
          iss = os.environ["APPLE_API_ISSUER_ID"].strip()
          p8 = os.environ["APPLE_API_PRIVATE_KEY"].strip()
          now = int(time.time())
          hdr_b64 = b64u(json.dumps({"alg": "ES256", "kid": kid, "typ": "JWT"}, separators=(",", ":")).encode())
          pay_b64 = b64u(json.dumps({"iss": iss, "iat": now - 30, "exp": now + 900, "aud": "appstoreconnect-v1"}, separators=(",", ":")).encode())
          signing_input = f"{hdr_b64}.{pay_b64}".encode("ascii")

          with tempfile.NamedTemporaryFile("w", suffix=".p8", delete=False) as tf:
              tf.write(p8 + "\n")
              p8_path = tf.name
          try:
              der_sig = subprocess.check_output(["openssl", "dgst", "-sha256", "-sign", p8_path], input=signing_input)
          finally:
              os.remove(p8_path)

          jwt_tok = f"{hdr_b64}.{pay_b64}.{b64u(der_to_raw_ecdsa(der_sig))}"
          req = urllib.request.Request(
              "https://api.appstoreconnect.apple.com/v1/profiles?limit=50",
              headers={"Authorization": f"Bearer {jwt_tok}"},
          )
          with urllib.request.urlopen(req, timeout=20) as resp:
              profs = json.loads(resp.read().decode("utf-8")).get("data", [])
          kb_prof = next(
              p for p in profs
              if p["attributes"]["name"] == "Ghosti Share App Store" and p["attributes"]["profileState"] == "ACTIVE"
          )
          raw_pp = base64.b64decode(kb_prof["attributes"]["profileContent"])
          kb_uuid = kb_prof["attributes"]["uuid"]
          dest_dir = os.path.expanduser("~/Library/MobileDevice/Provisioning Profiles")
          with open(os.path.join(dest_dir, f"{kb_uuid}.mobileprovision"), "wb") as out_f:
              out_f.write(raw_pp)
          print("Installed Keyboard Provisioning Profile UUID:", kb_uuid)
          PYEOF

      - name: Archive & Export Signed IPA
        working-directory: ghosti
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          cat << EOF > $RUNNER_TEMP/ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>teamID</key>
              <string>${TEAM_ID}</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>uploadSymbols</key>
              <true/>
              <key>provisioningProfiles</key>
              <dict>
                  <key>app.sundreamer.ghosti</key>
                  <string>Ghosti App Store</string>
                  <key>app.sundreamer.ghosti.share</key>
                  <string>Ghosti Share App Store</string>
              </dict>
          </dict>
          </plist>
          EOF

          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath $RUNNER_TEMP/Ghosti.xcarchive \
            archive

          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/Ghosti.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist \
            -exportPath $RUNNER_TEMP/export

          ls -lh $RUNNER_TEMP/export

      - name: Upload IPA to App Store Connect (TestFlight)
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APPLE_API_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8
          IPA_FILE=$(ls $RUNNER_TEMP/export/*.ipa | head -n 1)
          echo "Uploading $IPA_FILE to TestFlight..."
          xcrun altool --upload-app \
            --type ios \
            -f "$IPA_FILE" \
            --apiKey "$APPLE_API_KEY_ID" \
            --apiIssuer "$APPLE_API_ISSUER_ID"

      - name: Shred Temporary Signing Credentials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true
          rm -rf "$RUNNER_TEMP/build_certificate.p12" "$RUNNER_TEMP/build_pp.mobileprovision" "$RUNNER_TEMP/build_kb_pp.mobileprovision" ~/.appstoreconnect/private_keys || true
